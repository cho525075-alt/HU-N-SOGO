<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Continuity Director V6 — Sản xuất hàng loạt</title>
<style>
:root{--bg:#090d12;--panel:#10161d;--panel2:#121923;--line:#283240;--text:#eef3f7;--muted:#8fa0b3;--green:#78e3b1;--warn:#ffd27a;--bad:#ff8b8b;--blue:#8bb8ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}
button,input,textarea,select{font:inherit;color:var(--text);background:#0b1118;border:1px solid var(--line);border-radius:8px;padding:9px}
button{cursor:pointer}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);padding:14px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-weight:800;margin-bottom:20px}
nav button{display:block;width:100%;text-align:left;margin:4px 0;background:transparent}.active{background:#1a222d!important}
main{min-width:0}.top{height:66px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.page{padding:20px}.grid{display:grid;gap:12px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}.muted{color:var(--muted)}
h2,h3{margin:0 0 12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}
label{display:block;color:var(--muted);font-size:12px;margin:8px 0 5px}textarea{width:100%;min-height:88px}input,select{width:100%}
.btn{background:#eef3f7;color:#071019;font-weight:700}.ai{background:#1b2632;border-color:#3a5878;color:#dceaff;font-weight:700}
.good{color:var(--green)}.warn{color:var(--warn)}.bad{color:var(--bad)}.blue{color:var(--blue)}
.scene{padding:10px;border:1px solid var(--line);border-radius:8px;margin:7px 0;cursor:pointer}.scene.sel{border-color:#8ea2b8;background:#151d27}
.editor{display:grid;grid-template-columns:230px minmax(520px,1fr) 320px;gap:12px}.state-card{background:var(--panel2);padding:12px;border-radius:9px;border:1px solid var(--line);margin:8px 0}
.small{font-size:12px}.pill{border:1px solid var(--line);padding:4px 7px;border-radius:999px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
pre{white-space:pre-wrap;background:#070b10;border:1px solid var(--line);padding:12px;border-radius:8px;max-height:420px;overflow:auto}
.notice{border:1px solid #38516b;background:#0f1822;padding:12px;border-radius:8px}
.template{border:1px solid var(--line);border-radius:9px;padding:12px;cursor:pointer}.template:hover{border-color:#6e849b}.template.sel{border-color:var(--blue);background:#111b26}
.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left}.right{text-align:right}
@media(max-width:1100px){.app{grid-template-columns:1fr}aside{height:auto;position:static}.editor,.g2,.g3,.g4{grid-template-columns:1fr}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body><div class="app">
<aside><div class="brand">CD &nbsp; Continuity Director<br><span class="muted small">V6 · Sản xuất hàng loạt · Tiếng Việt</span></div>
<nav id="nav"></nav><hr style="border-color:#283240">
<button onclick="taoDuAnMoi()">+ Tạo dự án mới</button>
<button onclick="xuatDuAn()">Xuất dữ liệu dự án</button>
<label class="btn" style="display:block;text-align:center;margin-top:8px">Nhập dữ liệu dự án<input type="file" accept=".json" hidden onchange="nhapDuAn(event)"></label>
</aside>
<main><div class="top"><div><span class="muted small">DỰ ÁN</span><br><b id="tenDuAn"></b></div><div id="luu">Đã lưu</div></div><div class="page" id="noiDung"></div></main>
</div>
<script>
const K='continuity_director_v11';
const MAU_PHIM=[
 {id:'drama_gia_dinh',ten:'Phim drama gia đình',moTa:'Xung đột, bí mật, đối thoại, cảm xúc đời thường',canh:24,nhac:'căng thẳng nhẹ, tiết chế',camera:'phim truyền hình điện ảnh'},
 {id:'hoc_duong',ten:'Phim học đường',moTa:'Bạn bè, tình cảm, mâu thuẫn trường lớp',canh:24,nhac:'trẻ trung, nhẹ nhàng',camera:'năng động, cận cảm xúc'},
 {id:'tinh_cam',ten:'Phim tình cảm',moTa:'Quan hệ đôi lứa, hiểu lầm, chia tay, hàn gắn',canh:24,nhac:'cảm xúc, tối giản',camera:'cận cảnh, mềm mại'},
 {id:'trinh_tham',ten:'Phim trinh thám',moTa:'Manh mối, điều tra, suy luận, hé lộ',canh:30,nhac:'bí ẩn, căng thẳng',camera:'kiểm soát, nhiều chi tiết'},
 {id:'kinh_di',ten:'Phim kinh dị',moTa:'Bầu không khí, nguy hiểm, bất an, bí ẩn',canh:30,nhac:'rùng rợn, không gian âm thanh dày',camera:'chậm, góc nhìn chủ quan'},
 {id:'hai',ten:'Phim hài',moTa:'Tình huống, nhịp nhanh, phản ứng nhân vật',canh:20,nhac:'nhẹ, vui',camera:'rõ hành động, timing tốt'},
 {id:'hanh_dong',ten:'Phim hành động',moTa:'Truy đuổi, đối đầu, hành động rõ ràng',canh:32,nhac:'dồn dập',camera:'động nhưng dễ đọc hành động'},
 {id:'quang_cao',ten:'Video quảng cáo',moTa:'Sản phẩm, lợi ích, thông điệp, kêu gọi hành động',canh:8,nhac:'thương mại, rõ nhịp',camera:'sạch, sản phẩm là trung tâm'},
 {id:'san_pham',ten:'Video giới thiệu sản phẩm',moTa:'Tính năng, cận cảnh, trải nghiệm sử dụng',canh:10,nhac:'hiện đại',camera:'macro, product shot'},
 {id:'mv',ten:'MV / video âm nhạc',moTa:'Hình ảnh, nhịp điệu, mood, biểu diễn',canh:20,nhac:'theo ca khúc',camera:'phong cách, chuyển động'},
 {id:'lich_su',ten:'Phim lịch sử',moTa:'Bối cảnh thời kỳ, trang phục, sự kiện',canh:30,nhac:'điện ảnh, trang trọng',camera:'rộng, tôn bối cảnh'},
 {id:'co_trang',ten:'Phim cổ trang',moTa:'Thế giới cổ trang, nhân vật, lễ nghi, xung đột',canh:30,nhac:'cổ phong',camera:'điện ảnh, bố cục cân đối'},
 {id:'khoa_hoc_vien_tuong',ten:'Khoa học viễn tưởng',moTa:'Công nghệ, thế giới tương lai, quy tắc logic',canh:30,nhac:'điện tử, không gian',camera:'quy mô lớn, chi tiết công nghệ'},
 {id:'hoat_hinh',ten:'Phim hoạt hình / AI stylized',moTa:'Nhân vật stylized, thế giới linh hoạt',canh:24,nhac:'tùy phong cách',camera:'rõ hình khối, chuyển động'},
 {id:'tai_lieu',ten:'Phim tài liệu / kể chuyện',moTa:'Thông tin, lời dẫn, hình minh họa',canh:20,nhac:'trung tính',camera:'rõ thông tin'},
 {id:'mang_xa_hoi',ten:'TikTok / Shorts kể chuyện',moTa:'Hook nhanh, nhịp ngắn, giữ chân người xem',canh:12,nhac:'nhịp nhanh',camera:'9:16, cận, rõ chủ thể'},
 {id:'tuy_chinh',ten:'Thể loại tùy chỉnh',moTa:'Tự định nghĩa phong cách và pipeline',canh:20,nhac:'tùy chỉnh',camera:'tùy chỉnh'}
];
const mauDuAn={
 ten:'7 NGÀY TRƯỚC KHI LY HÔN',theLoai:'drama_gia_dinh',tiLe:'9:16',thoiLuongCanh:8,soCanhMucTieu:24,ngonNgu:'Tiếng Việt',story:'',
 cheDoLo:'theo_chuoi',soLuongSongSong:3,
 voice:{ngonNgu:'Tiếng Việt',vungMien:'Miền Bắc',tocDo:'1.0',hangDoi:[],khoaGiong:{}}, 
 hinhAnh:{cheDo:'online_ai',nhaCungCap:'OpenAI GPT Image',tiLeMacDinh:'9:16',hangDoi:[],khoa:{nhanVat:{},boiCanh:{},trangPhuc:{},daoCu:{}},phienBanAnh:{}},
 taiSan:{nhanVat:[{id:'NGHIA',ten:'Nghĩa',moTa:'Nam 34 tuổi, tóc đen ngắn, khuôn mặt chữ điền'},{id:'TRANG',ten:'Trang',moTa:'Nữ 32 tuổi, khuôn mặt trái xoan'}],
 boiCanh:[{id:'HOME_NT_01',ten:'Phòng khách nhà Nghĩa–Trang',moTa:'Sofa trái, bàn trà giữa, TV phía trước'}],
 trangPhuc:[{id:'NGHIA_HOME_01',ten:'Nghĩa · ở nhà',nhanVatId:'NGHIA',moTa:'Trang phục ở nhà'}],
 daoCu:[{id:'PHONE_TRANG_01',ten:'Điện thoại Trang',chuSoHuu:'TRANG',moTa:'Điện thoại màu đen'}]},
 canh:[]
};
let P=JSON.parse(localStorage.getItem(K)||localStorage.getItem('continuity_director_v6')||'null')||mauDuAn, trang='tong_quan', chon=0;
function sao(x){return JSON.parse(JSON.stringify(x))}
function e(s=''){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function luu(){
 localStorage.setItem(K,JSON.stringify(P));
 tenDuAn.textContent=P.ten;
 document.querySelector('#luu').textContent='Đã lưu '+new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});
 henDongBoCloud();
}

const TY_LE_KHUNG_HINH=[
  ['9:16','Dọc — TikTok / Reels / Shorts'],
  ['16:9','Ngang — YouTube / TV'],
  ['1:1','Vuông — Social'],
  ['4:5','Dọc — Instagram / Facebook Feed'],
  ['3:4','Dọc — Ảnh truyền thống'],
  ['2:3','Dọc — Poster / chân dung'],
  ['3:2','Ngang — Ảnh / điện ảnh'],
  ['4:3','Ngang — TV / truyền thống'],
  ['5:4','Ngang — Ảnh / in ấn'],
  ['21:9','Siêu rộng — Cinematic'],
  ['2.39:1','CinemaScope'],
  ['2.35:1','Cinematic rộng']
];
function optionTiLe(v){return TY_LE_KHUNG_HINH.map(x=>`<option value="${x[0]}" ${v===x[0]?'selected':''}>${x[0]} · ${x[1]}</option>`).join('')}
function tiLeAnhDangChon(){let el=document.querySelector('#tiLeAnh');return el?.value||P.hinhAnh?.tiLeMacDinh||P.tiLe||'9:16'}
function doiTiLeAnh(){
  let v=tiLeAnhDangChon();
  P.hinhAnh=P.hinhAnh||{};P.hinhAnh.tiLeMacDinh=v;luu();
  let ref=document.querySelector('#refAnh')?.value||'';
  if(ref)document.querySelector('#promptAnh').value=goiYTaoAnh(document.querySelector('#loaiAnh').value,ref,v);
}
function nav(){let ds=[['tong_quan','Tổng quan'],['online_team','Online Team'],['team_control','Phân công & khóa cảnh'],['loai_phim','Loại phim & mẫu sản xuất'],['story','Kịch bản & chia cảnh'],['canh','Đạo diễn cảnh'],['hinh_anh','Studio tạo hình ảnh'],['khoa_anh','Khóa hình ảnh & Continuity'],['voice','Giọng nói & lời thoại'],['flow_ultra','Veo Ultra / Flow'],['san_xuat','Sản xuất hàng loạt'],['bang','Bảng sản xuất'],['xuat','Xuất dự án']];document.querySelector('#nav').innerHTML=ds.map(x=>`<button class="${trang===x[0]?'active':''}" onclick="den('${x[0]}')">${x[1]}</button>`).join('')}
function den(x){trang=x;nav();ve()}
function truong(lbl,val,on,area=false){return `<label>${lbl}</label>${area?`<textarea onchange="${on}">${e(val||'')}</textarea>`:`<input value="${e(val||'')}" onchange="${on}">`}`}
function ve(){luu();if(trang==='tong_quan')tongQuan();if(trang==='online_team')onlineTeam();if(trang==='team_control')teamControl();if(trang==='loai_phim')loaiPhim();if(trang==='story')story();if(trang==='canh')daoDien();if(trang==='hinh_anh')studioHinhAnh();if(trang==='flow_ultra')flowUltra();if(trang==='khoa_anh')khoaAnhContinuity();if(trang==='voice')voiceDirector();if(trang==='san_xuat')sanXuatLo();if(trang==='bang')bangSanXuat();if(trang==='xuat')trangXuat()}
function tongQuan(){let m=MAU_PHIM.find(x=>x.id===P.theLoai)||MAU_PHIM[0],tong=P.canh.length,ss=P.canh.filter(x=>x.trangThai==='SẴN SÀNG').length,duyet=P.canh.filter(x=>x.trangThai==='ĐÃ DUYỆT').length;noiDung.innerHTML=`<h2>Tổng quan dự án</h2><div class="grid g4"><div class=card><h3>${e(P.ten)}</h3><span class=muted>${e(m.ten)}</span></div><div class=card><h3>${tong}</h3><span class=muted>Tổng số cảnh</span></div><div class=card><h3>${ss}</h3><span class=muted>Sẵn sàng sản xuất</span></div><div class=card><h3>${duyet}</h3><span class=muted>Đã duyệt</span></div></div><div class=card style="margin-top:12px"><h3>Pipeline</h3>Chọn loại phim → Kịch bản → Chia cảnh → Tạo hình ảnh → Khóa ảnh → Giọng nói & lời thoại → Keyframe → Continuity → Sản xuất hàng loạt → Duyệt → Xuất<br><br><span class=good>✓ Toàn bộ giao diện dùng tiếng Việt</span></div>`}
function loaiPhim(){let m=MAU_PHIM.find(x=>x.id===P.theLoai)||MAU_PHIM[0];noiDung.innerHTML=`<h2>Loại phim & mẫu sản xuất</h2><div class=card><div class="grid g3">${MAU_PHIM.map(x=>`<div class="template ${P.theLoai===x.id?'sel':''}" onclick="chonMau('${x.id}')"><b>${e(x.ten)}</b><p class=muted>${e(x.moTa)}</p><span class=pill>${x.canh} cảnh gợi ý</span></div>`).join('')}</div></div><div class=card style="margin-top:12px"><h3>Cấu hình hiện tại</h3><div class="grid g3">${truong('Tên dự án',P.ten,`P.ten=this.value;luu()`)}<div><label>Tỷ lệ khung hình</label><select onchange="P.tiLe=this.value;P.hinhAnh=P.hinhAnh||{};P.hinhAnh.tiLeMacDinh=this.value;luu()">${optionTiLe(P.tiLe)}</select></div>${truong('Thời lượng mỗi cảnh (giây)',P.thoiLuongCanh,`P.thoiLuongCanh=+this.value;luu()`)}${truong('Số cảnh mục tiêu',P.soCanhMucTieu,`P.soCanhMucTieu=+this.value;luu()`)}${truong('Ngôn ngữ',P.ngonNgu,`P.ngonNgu=this.value;luu()`)}<div><label>Chế độ sản xuất</label><select onchange="P.cheDoLo=this.value;luu()"><option value="theo_chuoi" ${P.cheDoLo==='theo_chuoi'?'selected':''}>Theo chuỗi continuity</option><option value="song_song" ${P.cheDoLo==='song_song'?'selected':''}>Song song cảnh độc lập</option><option value="ket_hop" ${P.cheDoLo==='ket_hop'?'selected':''}>Kết hợp thông minh</option></select></div></div><div class=notice style="margin-top:12px"><b>Phong cách gợi ý:</b> ${e(m.camera)} · <b>Âm nhạc:</b> ${e(m.nhac)}</div></div>`}
function chonMau(id){let m=MAU_PHIM.find(x=>x.id===id);P.theLoai=id;P.soCanhMucTieu=m.canh;if(id==='quang_cao'||id==='san_pham')P.thoiLuongCanh=8;if(id==='mang_xa_hoi')P.tiLe='9:16';luu();ve()}
function tach(txt){return txt.split(/\n+|(?<=[.!?])\s+/).map(x=>x.trim()).filter(x=>x.length>8)}
function trangThaiMacDinh(){return {viTri:'',chuThe:'',camXuc:'trung tính'}}
function stateRong(){return {boiCanh:P.taiSan.boiCanh[0]?.id||'',thoiGian:'',anhSang:'',nhanVat:[],daoCu:[]}}
function taoCanhTuCau(x,i,truoc){let t=x.toLowerCase(),loai=P.theLoai;let muc='Phát triển diễn biến.';if(loai==='quang_cao'||loai==='san_pham')muc='Làm rõ lợi ích hoặc đặc điểm sản phẩm.';if(loai==='trinh_tham')muc='Đưa thêm manh mối hoặc thay đổi hướng điều tra.';if(loai==='kinh_di')muc='Tăng cảm giác bất an hoặc hé lộ nguy hiểm.';if(loai==='hai')muc='Tạo nhịp hài hoặc phản ứng gây cười.';if(loai==='mang_xa_hoi')muc=i===0?'Tạo hook giữ người xem ngay đầu video.':'Giữ nhịp nhanh và đẩy câu chuyện.';let start=truoc?sao(truoc):stateRong(),end=sao(start);return {id:'SC'+String(i+1).padStart(3,'0'),tieuDe:x.slice(0,45),yTuong:x,mucDich:muc,nguyenNhan:i?'Tiếp nối kết quả cảnh trước.':'Mở đầu diễn biến.',hanhDong:x,loiThoai:(x.match(/["“](.+?)["”]/)||[])[1]||'',dienXuat:'Tự nhiên, tiết chế, đúng cảm xúc cảnh.',camera:(MAU_PHIM.find(m=>m.id===loai)||MAU_PHIM[0]).camera,amThanh:'Giữ âm nền đồng nhất theo sequence.',trangThai:'NHÁP',start,end,phuThuoc:i?['SC'+String(i).padStart(3,'0')]:[],nhom:i<5?'SEQ01':'SEQ'+String(Math.floor(i/5)+1).padStart(2,'0')}}
function story(){noiDung.innerHTML=`<h2>Kịch bản & chia cảnh</h2><div class=card><label>Dán cốt truyện / kịch bản</label><textarea id=storyText style="min-height:260px">${e(P.story)}</textarea><div class=toolbar><button class=ai onclick="taoHangLoat()">✨ Phân tích & tạo hàng loạt cảnh</button><button onclick="chiaThuCong()">Chia cảnh nhanh</button><button onclick="xoaCanh()">Xóa toàn bộ cảnh</button></div><div class=notice><b>Mục tiêu:</b> ${P.soCanhMucTieu} cảnh · ${P.thoiLuongCanh}s/cảnh · ${e((MAU_PHIM.find(x=>x.id===P.theLoai)||{}).ten||'')}</div></div><div class=card style="margin-top:12px"><h3>Danh sách cảnh (${P.canh.length})</h3>${P.canh.slice(0,60).map(s=>`<div class=scene><b>${s.id}</b> · ${e(s.tieuDe)} <span class=pill>${e(s.nhom)}</span><br><span class=muted>${e(s.mucDich)}</span></div>`).join('')||'<span class=muted>Chưa có cảnh.</span>'}</div>`}
function taoHangLoat(){let txt=document.querySelector('#storyText').value.trim();if(!txt)return alert('Hãy dán kịch bản trước.');P.story=txt;let ds=tach(txt);if(ds.length<P.soCanhMucTieu&&ds.length>0){let mo=[];for(let x of ds){let p=x.split(/,|;| rồi | sau đó | nhưng /).map(y=>y.trim()).filter(y=>y.length>7);mo.push(...(p.length?p:[x]))}ds=mo}ds=ds.slice(0,Math.max(P.soCanhMucTieu,ds.length));let prev=null;P.canh=ds.map((x,i)=>{let s=taoCanhTuCau(x,i,prev);prev=s.end;return s});chon=0;luu();den('canh')}
function chiaThuCong(){taoHangLoat()}
function xoaCanh(){if(confirm('Xóa toàn bộ cảnh?')){P.canh=[];ve()}}

    return `Ảnh tham chiếu trang phục, chỉ nhân vật mặc trang phục này, nền trơn, không môi trường. ${a?.ten||''}. ${a?.moTa||''}. Toàn thân, chính diện, ánh sáng trung tính, dùng để khóa outfit. Tỷ lệ ${tiLe}.`;
  }
  if(loai==='dao_cu'){
    let a=P.taiSan.daoCu.find(x=>x.id===ref)||P.taiSan.daoCu[0];
    return `Ảnh đạo cụ tham chiếu, một vật thể duy nhất, nền trơn, không người. ${a?.ten||''}. ${a?.moTa||''}. Góc nhìn rõ hình dáng, màu sắc và chi tiết nhận diện. Tỷ lệ ${tiLe}.`;
  }
  if(loai==='keyframe'){

async function taoAnhAI(i){
  let j=P.hinhAnh.hangDoi[i];
  if(!j)return;
  if(!IMAGE_API_OK)return alert('Backend tạo ảnh AI chưa sẵn sàng. Hãy cấu hình OPENAI_API_KEY hoặc GEMINI_API_KEY trên Vercel.');
  j.trangThai='ĐANG TẠO';
  j.loi='';
  luu();ve();
  try{
    const r=await fetch('/api/generate-image',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        prompt:j.prompt,
        aspectRatio:j.tiLe||P.hinhAnh?.tiLeMacDinh||P.tiLe||'9:16',
        quality:j.chatLuong||'medium',
        background:j.nen||'auto',
        provider:j.provider||nhaCungCapAnhDangChon(),
        model:j.modelChon||modelAnhDangChon(),
        mode:j.cheDo||cheDoAnhDangChon(),
        fallback:(j.fallback!==undefined?j.fallback:choPhepFallbackAnh())
      })
    });
    const data=await r.json();
    if(!r.ok)throw new Error(data.error||'Không tạo được ảnh');
    j.anhData=data.image;
    j.trangThai='ĐÃ CÓ ẢNH';
    j.model=data.model||'';
    j.provider=data.provider||j.provider||'';
    j.size=data.size||data.aspectRatio||'';
    j.fallbackUsed=!!data.fallbackUsed;
    j.attempts=data.attempts||[];
    j.generatedAt=new Date().toISOString();
    j.loi='';
    luu();ve();
  }catch(err){
    j.trangThai='THẤT BẠI';
    j.loi=err.message||String(err);
    luu();ve();
    alert('Tạo ảnh thất bại: '+j.loi);
  }
}
async function taoTatCaAnhCho(){
  if(!IMAGE_API_OK)return alert('Backend tạo ảnh AI chưa sẵn sàng. Hãy thêm ít nhất một API key trên Vercel.');
  let ds=P.hinhAnh.hangDoi.map((x,i)=>({x,i})).filter(o=>o.x.trangThai==='CHỜ TẠO'||o.x.trangThai==='THẤT BẠI');
  if(!ds.length)return alert('Không có tác vụ ảnh nào đang chờ.');
  for(let o of ds) await taoAnhAI(o.i);
  alert('Đã xử lý hết hàng đợi ảnh.');
}
function themVaTaoNgay(){
  let before=P.hinhAnh?.hangDoi?.length||0;
  themVaoHangDoiAnh();
  let after=P.hinhAnh?.hangDoi?.length||0;
  if(after>before){
    let i=after-1;
    P.hinhAnh.hangDoi[i].chatLuong=chatLuongAnhDangChon();
    P.hinhAnh.hangDoi[i].nen=nenAnhDangChon();
    P.hinhAnh.hangDoi[i].provider=nhaCungCapAnhDangChon();
    P.hinhAnh.hangDoi[i].modelChon=modelAnhDangChon();
    P.hinhAnh.hangDoi[i].cheDo=cheDoAnhDangChon();
    P.hinhAnh.hangDoi[i].fallback=choPhepFallbackAnh();
    luuCauHinhAnh();
    taoAnhAI(i);
  }
}

function damBaoCauTrucAnh(){
  P.hinhAnh=P.hinhAnh||{cheDo:'online_ai',nhaCungCap:'OpenAI GPT Image',tiLeMacDinh:P.tiLe,hangDoi:[],khoa:{nhanVat:{},boiCanh:{},trangPhuc:{},daoCu:{}},phienBanAnh:{}};
  P.hinhAnh.khoa=P.hinhAnh.khoa||{nhanVat:{},boiCanh:{},trangPhuc:{},daoCu:{}};
  P.hinhAnh.phienBanAnh=P.hinhAnh.phienBanAnh||{};
}
function anhDaDuyetTheo(loai,ref){
  damBaoCauTrucAnh();
  const rev={nhanVat:'nhan_vat',boiCanh:'boi_canh',trangPhuc:'trang_phuc',daoCu:'dao_cu',keyframe:'keyframe'};
  const jobLoai=rev[loai]||loai;
  return P.hinhAnh.hangDoi.filter(x=>x.loai===jobLoai && x.ref===ref && x.trangThai==='ĐÃ DUYỆT' && x.anhData);
}
function khoaAnh(loai,ref,jobId){
  damBaoCauTrucAnh();
  P.hinhAnh.khoa[loai][ref]=jobId;
  luu();ve();
}
function boKhoaAnh(loai,ref){
  damBaoCauTrucAnh();
  delete P.hinhAnh.khoa[loai][ref];
  luu();ve();
}
function jobTheoId(id){damBaoCauTrucAnh();return P.hinhAnh.hangDoi.find(x=>x.id===id)}
function taoPromptKeyframeCoReference(sceneId){
  damBaoCauTrucAnh();
  let s=P.canh.find(x=>x.id===sceneId);
  if(!s)return '';
  let phong=(MAU_PHIM.find(x=>x.id===P.theLoai)||MAU_PHIM[0]);
  let refs=[];
  for(let [ref,jobId] of Object.entries(P.hinhAnh.khoa.nhanVat||{})){
    let j=jobTheoId(jobId); if(j) refs.push(`Nhân vật ${ref}: dùng ảnh khóa ${jobId}`);
  }
  for(let [ref,jobId] of Object.entries(P.hinhAnh.khoa.boiCanh||{})){
    let j=jobTheoId(jobId); if(j) refs.push(`Bối cảnh ${ref}: dùng ảnh khóa ${jobId}`);
  }
  for(let [ref,jobId] of Object.entries(P.hinhAnh.khoa.trangPhuc||{})){
    let j=jobTheoId(jobId); if(j) refs.push(`Trang phục ${ref}: dùng ảnh khóa ${jobId}`);
  }
  for(let [ref,jobId] of Object.entries(P.hinhAnh.khoa.daoCu||{})){
    let j=jobTheoId(jobId); if(j) refs.push(`Đạo cụ ${ref}: dùng ảnh khóa ${jobId}`);
  }
  return `Ảnh keyframe điện ảnh cho ${s.id} — ${s.tieuDe}.
Mục đích cảnh: ${s.mucDich}
Một hành động chính: ${s.hanhDong}
Diễn xuất: ${s.dienXuat}
Máy quay: ${s.camera}
Âm thanh không ảnh hưởng hình ảnh.
Phong cách: ${phong.camera}.
Tỷ lệ: ${P.tiLe}.

KHÓA HÌNH ẢNH THAM CHIẾU:
${refs.length?refs.join('\n'):'Chưa có ảnh khóa; ưu tiên giữ nhận diện theo asset hiện có.'}

YÊU CẦU CONTINUITY:
- Giữ nguyên khuôn mặt, tóc, vóc dáng và độ tuổi của nhân vật.
- Giữ nguyên trang phục đã khóa.
- Giữ bố cục bối cảnh và các vật thể neo cố định.
- Giữ hình dáng, màu sắc và trạng thái đạo cụ.
- Không thêm người, đạo cụ, chữ hoặc vật thể ngoài kế hoạch.
- Không tự đổi góc trái/phải của không gian nếu không có chỉ dẫn.
- Chỉ thể hiện đúng một hành động chính của cảnh.`;
}
function capNhatPromptKeyframeTheoKhoa(){
  damBaoCauTrucAnh();
  let n=0;
  for(let j of P.hinhAnh.hangDoi){
    if(j.loai==='keyframe' && j.trangThai!=='ĐÃ DUYỆT'){
      j.prompt=taoPromptKeyframeCoReference(j.ref);
      n++;
    }
  }
  luu();alert('Đã cập nhật '+n+' prompt keyframe theo ảnh khóa.');ve();
}
function tinhDiemKhoaAnh(){
  damBaoCauTrucAnh();
  let total=P.taiSan.nhanVat.length+P.taiSan.boiCanh.length+P.taiSan.trangPhuc.length+P.taiSan.daoCu.length;
  let locked=Object.keys(P.hinhAnh.khoa.nhanVat||{}).length+Object.keys(P.hinhAnh.khoa.boiCanh||{}).length+Object.keys(P.hinhAnh.khoa.trangPhuc||{}).length+Object.keys(P.hinhAnh.khoa.daoCu||{}).length;
  return {total,locked,score:total?Math.round(locked/total*100):100};
}
function hangKhoaLoai(loai,assets){

    let jobId=P.hinhAnh.khoa[loai]?.[a.id]||'';
    let job=jobTheoId(jobId);
    let duyets=anhDaDuyetTheo(loai,a.id);
    return `<div class=state-card>
      <div class=row><b>${e(a.ten||a.id)}</b><span class=muted>${e(a.id)}</span>${jobId?'<span class="pill good">ĐÃ KHÓA</span>':'<span class="pill warn">CHƯA KHÓA</span>'}</div>
      ${job?.anhData?`<img src="${job.anhData}" style="max-width:160px;max-height:220px;object-fit:cover;border-radius:8px;border:1px solid var(--line);margin:10px 0">`:''}
      <label>Chọn ảnh đã duyệt để khóa</label>
      <select onchange="this.value?khoaAnh('${loai}','${a.id}',this.value):boKhoaAnh('${loai}','${a.id}')">
        <option value="">— Chưa khóa —</option>
        ${duyets.map(j=>`<option value="${j.id}" ${jobId===j.id?'selected':''}>${e(j.id)} · ${e(j.ref)}</option>`).join('')}
      </select>
      ${!duyets.length?'<div class=muted style="margin-top:8px">Chưa có ảnh ĐÃ DUYỆT cho asset này.</div>':''}
    </div>`;
  }).join('');
}

function hoSoGiongMacDinh(nv){
 let ten=(nv?.ten||'Nhân vật');
 return {nhanVatId:nv?.id||'',ten,gioiTinh:'Tự động',doTuoi:'Trưởng thành',vungMien:P.voice?.vungMien||'Miền Bắc',chatGiong:'Tự nhiên, điện ảnh, rõ lời',caoDo:'Trung bình',tocDo:'1.0',nangLuong:'Vừa',camXucMacDinh:'Tiết chế, tự nhiên',ghiChu:''};

function taoHoSoGiong(){
 damBaoVoice();
 for(let nv of P.taiSan.nhanVat){
   if(!P.voice.khoaGiong[nv.id])P.voice.khoaGiong[nv.id]=hoSoGiongMacDinh(nv);

 luu();ve();
}
function suaVoice(id,k,v){damBaoVoice();if(!P.voice.khoaGiong[id])P.voice.khoaGiong[id]=hoSoGiongMacDinh(P.taiSan.nhanVat.find(x=>x.id===id));P.voice.khoaGiong[id][k]=v;luu()}
function tachLoiThoai(s){
 let raw=(s.loiThoai||'').trim();
 if(!raw)return [];
 let lines=raw.split(/\n+/).map(x=>x.trim()).filter(Boolean);
 return lines.map((x,i)=>{
   let m=x.match(/^([^:：]{1,30})[:：]\s*(.+)$/);
   if(m){
     let name=m[1].trim(), nv=P.taiSan.nhanVat.find(n=>n.ten.toLowerCase()===name.toLowerCase()||n.id.toLowerCase()===name.toLowerCase());
     return {nhanVatId:nv?.id||'',nhanVat:nv?.ten||name,noiDung:m[2].trim(),thuTu:i+1};
   }
   let nv=P.taiSan.nhanVat[0];
   return {nhanVatId:nv?.id||'',nhanVat:nv?.ten||'Nhân vật',noiDung:x,thuTu:i+1};
 });
}
function taoNoiDungVoiceHangLoat(){
 damBaoVoice();taoHoSoGiong();
 let old=new Map(P.voice.hangDoi.map(x=>[x.canhId+'|'+x.thuTu,x]));
 let out=[];
 for(let s of P.canh){
   let ds=tachLoiThoai(s);
   for(let d of ds){
     let key=s.id+'|'+d.thuTu, prev=old.get(key), hs=P.voice.khoaGiong[d.nhanVatId]||hoSoGiongMacDinh(P.taiSan.nhanVat.find(x=>x.id===d.nhanVatId));
     out.push(prev||{id:'VOICE_'+String(out.length+1).padStart(4,'0'),canhId:s.id,thuTu:d.thuTu,nhanVatId:d.nhanVatId,nhanVat:d.nhanVat,noiDung:d.noiDung,camXuc:s.dienXuat||hs.camXucMacDinh,tocDo:hs.tocDo||'1.0',vungMien:hs.vungMien||'Miền Bắc',trangThai:'CHỜ TẠO',tepAmThanh:'',thoiLuongUocTinh:Math.max(1,Math.round(d.noiDung.length/12))});
   }
 }
 P.voice.hangDoi=out;luu();ve();
}

/* ===================== V11 TEAM CONTROL ===================== */
let TEAM_MEMBERS=[], ASSIGN_CACHE={}, LOCK_CACHE={}, VERSION_CACHE=[];
async function dongBoHoSoThanhVien(){
  if(!SB||!PHIEN||!WORKSPACE)return;
  try{await SB.rpc('sync_my_member_profile');}catch(err){console.warn('sync profile',err.message)}
}
async function taiTeamControl(){
  if(!SB||!WORKSPACE||!CLOUD_PROJECT_ID)return;
  let [m,a,l,v]=await Promise.all([
    SB.from('workspace_members').select('user_id,role,member_email,display_name').eq('workspace_id',WORKSPACE.id),
    SB.from('scene_assignments').select('*').eq('project_id',CLOUD_PROJECT_ID),
    SB.from('scene_locks').select('*').eq('project_id',CLOUD_PROJECT_ID),
    SB.from('project_versions').select('id,note,created_at,created_by').eq('project_id',CLOUD_PROJECT_ID).order('created_at',{ascending:false}).limit(20)
  ]);
  TEAM_MEMBERS=m.data||[];ASSIGN_CACHE={};(a.data||[]).forEach(x=>ASSIGN_CACHE[x.scene_id]=x);
  LOCK_CACHE={};(l.data||[]).forEach(x=>LOCK_CACHE[x.scene_id]=x);VERSION_CACHE=v.data||[];
}
function tenThanhVien(uid){let x=TEAM_MEMBERS.find(m=>m.user_id===uid);return x?.display_name||x?.member_email||uid?.slice(0,8)||'Chưa giao'}
function duocSuaCanh(sceneId){
  if(!CLOUD_PROJECT_ID||!PHIEN)return true;
  let l=LOCK_CACHE[sceneId]; if(!l)return true;
  if(new Date(l.expires_at)<new Date())return true;
  return l.locked_by===PHIEN.user.id;
}
async function phanCongCanh(sceneId,userId){
  if(!SB||!WORKSPACE||WORKSPACE.role!=='owner')return alert('Chỉ chủ đội được phân công cảnh.');
  if(!userId){let {error}=await SB.from('scene_assignments').delete().eq('project_id',CLOUD_PROJECT_ID).eq('scene_id',sceneId);if(error)return alert(error.message)}
  else{let {error}=await SB.from('scene_assignments').upsert({project_id:CLOUD_PROJECT_ID,scene_id:sceneId,assigned_to:userId,assigned_by:PHIEN.user.id,status:'ĐÃ GIAO'},{onConflict:'project_id,scene_id'});if(error)return alert(error.message)}
  await taiTeamControl();renderTeamControlBody();
}
async function khoaCanhTeam(sceneId){
  if(!SB||!CLOUD_PROJECT_ID)return alert('Hãy mở một dự án Cloud trước.');
  let {data,error}=await SB.rpc('acquire_scene_lock',{p_project_id:CLOUD_PROJECT_ID,p_scene_id:sceneId});
  if(error)return alert(error.message);if(!data)return alert('Cảnh đang được người khác khóa.');
  await taiTeamControl();renderTeamControlBody();
}
async function moKhoaCanhTeam(sceneId){
  let {error}=await SB.rpc('release_scene_lock',{p_project_id:CLOUD_PROJECT_ID,p_scene_id:sceneId});if(error)return alert(error.message);
  await taiTeamControl();renderTeamControlBody();
}
async function moVaKhoa(sceneId){
  await khoaCanhTeam(sceneId);await taiTeamControl();
  let l=LOCK_CACHE[sceneId];if(l&&l.locked_by!==PHIEN.user.id)return;
  let i=P.canh.findIndex(s=>s.id===sceneId);if(i>=0){chon=i;den('canh')}
}
async function taoPhienBanDuAn(){
  if(!CLOUD_PROJECT_ID)return alert('Chưa có dự án Cloud.');
  let note=prompt('Ghi chú phiên bản?','Bản trước khi chỉnh sửa')||'Bản thủ công';
  let {error}=await SB.from('project_versions').insert({project_id:CLOUD_PROJECT_ID,workspace_id:WORKSPACE.id,project_data:P,note,created_by:PHIEN.user.id});
  if(error)return alert(error.message);await taiTeamControl();renderTeamControlBody();alert('Đã lưu phiên bản dự án.');
}
async function phucHoiPhienBan(id){
  if(!confirm('Nạp phiên bản này vào máy hiện tại? Bản Cloud chỉ đổi sau khi bạn bấm Đồng bộ.'))return;
  let {data,error}=await SB.from('project_versions').select('project_data,note').eq('id',id).single();if(error)return alert(error.message);
  P=data.project_data;chon=0;localStorage.setItem(K,JSON.stringify(P));alert('Đã nạp phiên bản: '+(data.note||''));den('tong_quan');
}
async function xoaPhienBan(id){
  if(WORKSPACE.role!=='owner'||!confirm('Xóa phiên bản lịch sử này?'))return;
  let {error}=await SB.from('project_versions').delete().eq('id',id);if(error)return alert(error.message);await taiTeamControl();renderTeamControlBody();
}
function renderTeamControlBody(){
  let el=document.querySelector('#teamControlBody');if(!el)return;
  let locks=P.canh.filter(s=>LOCK_CACHE[s.id]).length, assigned=P.canh.filter(s=>ASSIGN_CACHE[s.id]).length;
  el.innerHTML=`<div class="grid g4"><div class=card><h3>${TEAM_MEMBERS.length}</h3><span class=muted>Thành viên</span></div><div class=card><h3>${P.canh.length}</h3><span class=muted>Cảnh</span></div><div class=card><h3>${assigned}</h3><span class=muted>Đã phân công</span></div><div class=card><h3>${locks}</h3><span class=muted>Đang khóa</span></div></div>
  <div class=card style="margin-top:12px"><div class=row><h3>Phân công cảnh</h3><div class=toolbar><button onclick=taiVaVeTeam()>Làm mới</button><button class=btn onclick=taoPhienBanDuAn()>Lưu phiên bản hiện tại</button></div></div>
  <table class=table><thead><tr><th>Cảnh</th><th>Sequence</th><th>Trạng thái</th><th>Người phụ trách</th><th>Khóa chỉnh sửa</th><th>Thao tác</th></tr></thead><tbody>${P.canh.map(s=>{let a=ASSIGN_CACHE[s.id],l=LOCK_CACHE[s.id],mine=l?.locked_by===PHIEN.user.id,expired=l&&new Date(l.expires_at)<new Date();return `<tr><td><b>${s.id}</b><br><span class=muted>${e(s.tieuDe)}</span></td><td>${e(s.nhom||'')}</td><td>${e(s.trangThai)}</td><td>${WORKSPACE.role==='owner'?`<select onchange="phanCongCanh('${s.id}',this.value)"><option value="">— Chưa giao —</option>${TEAM_MEMBERS.map(m=>`<option value="${m.user_id}" ${a?.assigned_to===m.user_id?'selected':''}>${e(tenThanhVien(m.user_id))}</option>`).join('')}</select>`:e(a?tenThanhVien(a.assigned_to):'Chưa giao')}</td><td>${!l||expired?'<span class="pill good">RẢNH</span>':mine?'<span class="pill warn">BẠN ĐANG KHÓA</span>':`<span class="pill bad">${e(tenThanhVien(l.locked_by))} đang sửa</span>`}</td><td>${(!l||expired)?`<button onclick="moVaKhoa('${s.id}')">Mở & khóa</button>`:mine?`<button class=btn onclick="chon=${P.canh.indexOf(s)};den('canh')">Tiếp tục sửa</button><button onclick="moKhoaCanhTeam('${s.id}')">Mở khóa</button>`:'<button disabled>Đang bị khóa</button>'}</td></tr>`}).join('')}</tbody></table></div>
  <div class=card style="margin-top:12px"><h3>Lịch sử phiên bản</h3>${VERSION_CACHE.length?VERSION_CACHE.map(v=>`<div class=state-card><div class=row><div><b>${e(v.note||'Phiên bản')}</b><br><span class=muted>${new Date(v.created_at).toLocaleString('vi-VN')} · ${e(tenThanhVien(v.created_by))}</span></div><div class=toolbar><button onclick="phucHoiPhienBan('${v.id}')">Nạp lại</button>${WORKSPACE.role==='owner'?`<button onclick="xoaPhienBan('${v.id}')">Xóa</button>`:''}</div></div></div>`).join(''):'<span class=muted>Chưa có phiên bản thủ công.</span>'}</div>
  <div class=notice style="margin-top:12px"><b>V11 chống ghi đè:</b> Nhân viên nên dùng “Mở & khóa” trước khi sửa cảnh. Khóa tự hết hạn sau 2 giờ. Chủ đội phân công cảnh và có thể lưu phiên bản trước các thay đổi lớn.</div>`;
}
async function taiVaVeTeam(){await taiTeamControl();renderTeamControlBody()}
function teamControl(){
  if(!SUPABASE_READY||!PHIEN||!WORKSPACE){noiDung.innerHTML='<h2>Phân công & khóa cảnh</h2><div class=card>Hãy vào <b>Online Team</b> để đăng nhập và tham gia đội trước.</div>';return}
  if(!CLOUD_PROJECT_ID){noiDung.innerHTML='<h2>Phân công & khóa cảnh</h2><div class=card>Hãy mở hoặc đưa dự án hiện tại lên Cloud trước.</div>';return}
  noiDung.innerHTML='<h2>Phân công & khóa cảnh</h2><div id=teamControlBody><span class=muted>Đang tải dữ liệu đội...</span></div>';setTimeout(taiVaVeTeam,0)
}
